services:
  postgres:
    image: postgres:16-alpine
    container_name: timely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: timely
      POSTGRES_PASSWORD: timely
      POSTGRES_DB: timely
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timely -d timely"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

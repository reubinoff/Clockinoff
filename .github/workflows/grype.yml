name: Grype vulnerability scan

# Anchore Grype scan against the surface that actually ships to Azure
# Web App: the Next.js standalone bundle only carries the production
# dependency tree, so we install deps with `--omit=dev` and point
# Grype at the resulting node_modules. There is no root Dockerfile to
# scan — see AGENTS.md and cd.yml for how the app is packaged. Do not
# add a second competing scanner (e.g. vuln-scan.yml) or invent an
# image target.
#
# Policy:
#   * Fail only on Critical or High (`severity-cutoff: high`). Medium
#     and below are reported for visibility but must NOT brick CD, so
#     the Azure deploy path in cd.yml stays green through transient
#     noise. Known Medium noise (and any temporarily-accepted
#     Critical/High) is baselined via the checked-in `.grype.yaml`,
#     each entry with a short rationale + FIXME.
#   * Runs on pushes to main and on pull requests so a regression is
#     caught before merge; a weekly cron re-runs the scan against the
#     same tree so newly disclosed vulns surface without needing a
#     code change.
#   * SARIF is uploaded to GitHub Code Scanning (Security → Code
#     scanning) so findings also appear as alerts. The upload step
#     uses `if: always()` so a failing High+ scan still publishes
#     the report.
#
# This workflow is intentionally decoupled from cd.yml — Azure deploy
# is not gated on it. Treat a red Grype run as a bug to triage, not a
# release blocker, until the policy is tightened.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

concurrency:
  group: grype-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for github/codeql-action/upload-sarif to publish findings
  # to Security → Code scanning.
  security-events: write

jobs:
  grype:
    name: Grype (prod deps, fail on High+)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install production dependencies only
        # Mirrors the deployed surface: cd.yml ships
        # `.next/standalone` whose bundled node_modules is the prod
        # dep tree. `--ignore-scripts` keeps native postinstalls
        # (argon2 prebuild fetch) off the scan runner — Grype reads
        # the package manifests directly, so native binaries aren't
        # needed for a correct scan.
        run: npm ci --omit=dev --ignore-scripts

      - name: Scan with Grype
        id: scan
        # Pinned to v7.4.2 by full commit SHA (not a floating tag).
        # Older majors (v3/v4) ship a Grype binary that still fetches
        # the deprecated v5 vulnerability DB, which Anchore stopped
        # refreshing in early 2026. The floating `v7` major tag has
        # also lagged the latest v7.x release. v7.4.2 bundles a Grype
        # that uses the maintained v6 DB and downloads a fresh copy
        # on every run.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "."
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: sarif
          add-cpes-if-none: true

      - name: Upload Grype SARIF
        # Publish even when the scan fails the High+ gate, so the
        # Security tab still shows what tripped the job.
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

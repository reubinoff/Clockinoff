name: CD (Azure Web App)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-azure-webapp
  cancel-in-progress: false

env:
  # Repo Actions variables (repo scope). Do not move these onto
  # `environment: production` — they are not environment-scoped.
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  NODE_VERSION: "24"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & deploy to Azure Web App
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache only `.next/cache` — Next.js's incremental compiler cache
      # (webpack/babel/SWC). This is purely additive: `.next/standalone`,
      # `.next/server`, and `.next/static` are regenerated by `next build`
      # on every run, so the deploy package assembled below cannot pick up
      # a stale production bundle from the cache. Keyed on the lockfile
      # (next version) + the full source tree so any source change
      # invalidates it; `restore-keys` lets a new commit warm-start from
      # the previous build's compile cache.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}', 'next.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js (standalone output)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # NEXTAUTH_SECRET is a build-time placeholder; the real value is
          # configured on the Azure Web App via App Settings / Key Vault refs.
          NEXTAUTH_SECRET: build-time-placeholder-build-time-placeholder
          # NEXTAUTH_URL is baked into the standalone bundle and used by
          # src/app/layout.tsx to resolve metadata.metadataBase for OG/Twitter
          # tags. Point it at the public custom domain so social previews
          # resolve to https://clockinoff.reubinoff.com and not the
          # azurewebsites.net origin. Runtime App Settings still override this
          # for anything that reads NEXTAUTH_URL at request time.
          NEXTAUTH_URL: https://clockinoff.reubinoff.com
        run: npm run build

      - name: Assemble deployment package
        run: |
          set -euo pipefail
          mkdir -p deploy
          # Standalone server bundle (includes a minimal, production-only node_modules).
          cp -R .next/standalone/. deploy/
          # Static assets Next needs at runtime.
          mkdir -p deploy/.next
          cp -R .next/static deploy/.next/static
          # Public assets.
          if [ -d public ]; then
            cp -R public deploy/public
          fi
          # Drizzle SQL migrations, applied at startup by scripts/migrate.mjs.
          mkdir -p deploy/drizzle
          cp -R drizzle/. deploy/drizzle/
          # Runtime migration runner. Plain ESM JS so it runs on `node`
          # directly using the `pg` package already bundled by Next standalone.
          # No `tsx` / TypeScript toolchain is required at runtime.
          mkdir -p deploy/scripts
          cp scripts/migrate.mjs deploy/scripts/migrate.mjs
          # Belt-and-suspenders: Next.js standalone tracing has historically
          # missed dynamically-loaded assets. next.config.mjs forces the affected
          # trees into the trace via outputFileTracingIncludes, but we also
          # overlay the source-installed copies here to guarantee the correct
          # files are present in the deployed bundle.
          #
          # 1. argon2 loads a prebuilt `.node` binary through `node-gyp-build`.
          #    Re-copy the linux-x64/glibc prebuild fetched by `npm ci` on this
          #    ubuntu-latest runner.
          # 2. @react-pdf/renderer → pdfkit (0.20.x) resolves the Standard 14
          #    fonts through a subpath-imports template
          #    `require('#standard-fonts/<Name>')` that the tracer cannot follow.
          #    Re-copy pdfkit and fontkit in full so PDF export can render.
          rm -rf deploy/node_modules/argon2
          mkdir -p deploy/node_modules/argon2
          cp -R node_modules/argon2/. deploy/node_modules/argon2/
          for dep in node-gyp-build node-addon-api @phc/format; do
            if [ -d "node_modules/${dep}" ] && [ ! -d "deploy/node_modules/${dep}" ]; then
              mkdir -p "deploy/node_modules/$(dirname "${dep}")"
              cp -R "node_modules/${dep}" "deploy/node_modules/${dep}"
            fi
          done
          for dep in pdfkit fontkit; do
            if [ -d "node_modules/${dep}" ]; then
              rm -rf "deploy/node_modules/${dep}"
              mkdir -p "deploy/node_modules/${dep}"
              cp -R "node_modules/${dep}/." "deploy/node_modules/${dep}/"
            fi
          done
          # @react-pdf/* is a group of ESM packages; overlay each subpackage
          # so any lazily-loaded helper file is present.
          if [ -d "node_modules/@react-pdf" ]; then
            mkdir -p "deploy/node_modules/@react-pdf"
            for sub in node_modules/@react-pdf/*; do
              name="$(basename "${sub}")"
              rm -rf "deploy/node_modules/@react-pdf/${name}"
              cp -R "${sub}" "deploy/node_modules/@react-pdf/${name}"
            done
          fi

      - name: Verify argon2 native module is loadable in deploy bundle
        run: |
          set -euo pipefail
          echo "Checking prebuild presence..."
          ls -la deploy/node_modules/argon2/prebuilds/linux-x64
          test -f deploy/node_modules/argon2/prebuilds/linux-x64/argon2.glibc.node
          echo "Loading argon2 from deploy/ under Node $(node -v)..."
          ( cd deploy && node -e "const a=require('argon2'); a.hash('smoketest',{type:a.argon2id}).then(h=>a.verify(h,'smoketest')).then(ok=>{if(!ok)throw new Error('verify failed');console.log('argon2 OK');}).catch(e=>{console.error(e);process.exit(1);});" )

      - name: Verify PDF export can render in deploy bundle
        run: |
          set -euo pipefail
          echo "Checking @react-pdf/renderer + pdfkit assets are present..."
          test -f deploy/node_modules/@react-pdf/renderer/lib/react-pdf.js
          test -f deploy/node_modules/pdfkit/js/standard-fonts/Helvetica.cjs
          test -f deploy/node_modules/pdfkit/js/data/sRGB_IEC61966_2_1.icc
          echo "Rendering a tiny PDF from deploy/ under Node $(node -v)..."
          ( cd deploy && node -e "
            const React = require('react');
            const { Document, Page, Text, renderToStream } = require('@react-pdf/renderer');
            const doc = React.createElement(
              Document, null,
              React.createElement(Page, { size: 'A4' },
                React.createElement(Text, null, 'cd-smoke'))
            );
            renderToStream(doc).then(s => {
              const chunks = [];
              s.on('data', c => chunks.push(c));
              s.on('end', () => {
                const buf = Buffer.concat(chunks);
                if (!buf.slice(0, 4).equals(Buffer.from('%PDF'))) {
                  console.error('Bad PDF header:', buf.slice(0, 8));
                  process.exit(2);
                }
                console.log('PDF OK', buf.length, 'bytes');
              });
              s.on('error', e => { console.error('STREAM ERR', e); process.exit(1); });
            }).catch(e => { console.error('RENDER REJECT', e); process.exit(3); });
          " )

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service startup command
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            az webapp config set \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --linux-fx-version "NODE|24-lts" \
              --startup-file "node scripts/migrate.mjs && node server.js"
            az webapp config appsettings set \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --settings \
                WEBSITES_PORT=3000 \
                PORT=3000 \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                WEBSITE_NODE_DEFAULT_VERSION=~24 \
                NEXT_TELEMETRY_DISABLED=1 \
              --output none

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy
          clean: true
          restart: true

      # #187: webapps-deploy reports success once the package is uploaded.
      # Startup is `node scripts/migrate.mjs && node server.js`, so a migrate
      # failure (for example the migrator role does not own Clockinoff tables)
      # leaves the site on 503 while this job would otherwise stay green.
      # Poll the public health route until it returns {"ok":true}, or fail
      # within about four minutes. The custom domain is preferred; the
      # azurewebsites hostname is the fallback.
      - name: Wait for production /api/health
        run: |
          set -euo pipefail
          primary="https://clockinoff.reubinoff.com/api/health"
          urls=("$primary")
          if [ -n "${AZURE_WEBAPP_NAME:-}" ]; then
            urls+=("https://${AZURE_WEBAPP_NAME}.azurewebsites.net/api/health")
          fi
          deadline=$((SECONDS + 240))
          attempt=0
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            for url in "${urls[@]}"; do
              body="$(mktemp)"
              code="000"
              if code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 "$url")"; then
                :
              else
                code="000"
              fi
              echo "health attempt ${attempt} ${url} -> ${code}"
              if [ "$code" = "200" ] && jq -e '.ok == true' "$body" >/dev/null 2>&1; then
                echo "Production health OK via ${url}"
                jq -c . "$body" || true
                rm -f "$body"
                exit 0
              fi
              last="$(cat "$body" 2>/dev/null || true)"
              rm -f "$body"
            done
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            sleep_for=10
            if [ "$remaining" -lt "$sleep_for" ]; then
              sleep_for=$remaining
            fi
            sleep "$sleep_for"
          done
          echo "Production /api/health did not return HTTP 200 {\"ok\":true} within 240s."
          echo "Last body:"
          printf '%s\n' "$last"
          exit 1

      - name: Azure logout
        if: always()
        run: az logout || true

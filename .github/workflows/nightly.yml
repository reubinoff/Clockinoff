name: Nightly regression

# Full regression: typecheck + lint + vitest (≥90% coverage gate) + Playwright
# e2e (register → timer → entries list refresh → CSV/PDF export). This is
# additive to `ci.yml` — nothing here deploys.
#
# Cron: 02:15 UTC daily, i.e. ~05:15 Asia/Jerusalem (04:15 during DST).
# Kept off-hour so morning triage sees the latest result. Manual runs via
# the "Run workflow" button (workflow_dispatch) are supported too.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

# Least privilege (CodeQL actions/missing-workflow-permissions, #196).
# contents: read covers checkout. actions: write is the cache scope:
# setup-node's npm cache, the Next.js compiler cache, and the
# Playwright browser cache all save entries.
permissions:
  contents: read
  actions: write

jobs:
  regression:
    name: Regression (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timely
          POSTGRES_PASSWORD: timely
          POSTGRES_DB: timely
        options: >-
          --health-cmd "pg_isready -U timely -d timely"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://timely:timely@localhost:5432/timely
      DATABASE_URL_TEST: postgres://timely:timely@localhost:5432/timely_test
      NEXTAUTH_SECRET: nightly-secret-nightly-secret-000000
      OAUTH_STATE_SECRET: nightly-oauth-state-secret-000000
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U timely && break
            sleep 1
          done

      - name: Create test database
        env:
          PGPASSWORD: timely
        run: |
          psql -h localhost -U timely -d postgres -c "CREATE DATABASE timely_test;" || true

      - name: Apply migrations (main + test DB)
        run: |
          npm run db:migrate
          DATABASE_URL=$DATABASE_URL_TEST npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage (fails under 90%)
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      # Cache only `.next/cache` — Next.js's incremental compiler cache
      # (webpack/babel/SWC). `.next/server` and `.next/static` are still
      # regenerated by `next build` on every run, so a stale production
      # bundle cannot be served from the cache.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}', 'next.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # e2e boots `next start` against the same Postgres, so build first.
      - name: Build Next.js app
        env:
          NODE_ENV: production
        run: npm run build

      # Playwright browsers are large (~chromium alone is >100MB). Cache
      # them in the documented location, keyed on the installed Playwright
      # version so a dependency bump invalidates the cache. On a cache hit
      # we still run `install-deps` to install the apt packages Chromium
      # needs on the runner (those cannot be cached across jobs), per the
      # Playwright CI docs.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e
        env:
          # `next start` runs here in NODE_ENV=production and reads
          # DATABASE_URL (= the `timely` DB). Playwright's globalSetup
          # (`tests/e2e/global-setup.ts`) runs the same migrations unit
          # tests use against that DB before the webServer listens; if
          # migrate fails the whole job fails. See GitHub issue #55.
          NODE_ENV: production
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

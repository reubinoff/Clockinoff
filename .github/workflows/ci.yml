name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "24"

# Least privilege (CodeQL actions/missing-workflow-permissions, #196).
# contents: read covers checkout. actions: write is the cache scope:
# setup-node's npm cache and the build job's actions/cache both save
# entries. Artifact upload uses the runtime token, not contents: write.
permissions:
  contents: read
  actions: write

jobs:
  # Fast "linters check" (issue #58): runs ESLint (and the cheap TypeScript
  # typecheck) with no Postgres service, so a lint-only regression fails in
  # ~a minute on push and PR instead of waiting on DB bootstrap in `test`.
  # The same checks still run inside `test` as a safety net.
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit + API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timely
          POSTGRES_PASSWORD: timely
          POSTGRES_DB: timely
        options: >-
          --health-cmd "pg_isready -U timely -d timely"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://timely:timely@localhost:5432/timely
      DATABASE_URL_TEST: postgres://timely:timely@localhost:5432/timely_test
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-000000
      OAUTH_STATE_SECRET: ci-oauth-state-secret-ci-oauth-000000
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U timely && break
            sleep 1
          done

      - name: Create test database
        env:
          PGPASSWORD: timely
        run: |
          psql -h localhost -U timely -d postgres -c "CREATE DATABASE timely_test;" || true

      - name: Create app runtime role
        run: node scripts/ensure-app-role.mjs

      - name: Apply migrations (main + test DB)
        run: |
          npm run db:migrate
          DATABASE_URL=$DATABASE_URL_TEST npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage (fails under 90%)
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: postgres://timely:timely@localhost:5432/timely
      NEXTAUTH_SECRET: build-secret-build-secret-build-000000
      OAUTH_STATE_SECRET: build-oauth-state-secret-build-000000
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Cache only `.next/cache` — Next.js's incremental compiler cache
      # (webpack/babel/SWC). This is additive: `.next/server` and
      # `.next/static` are always regenerated by `next build`, so a stale
      # production bundle cannot be served from the cache. Keyed on the
      # lockfile (next version) + the full source tree so any source change
      # invalidates it; `restore-keys` lets a new commit warm-start from the
      # previous build's compile cache.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}', 'next.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

  # Required status check for admin-removal hardening (#219 / #220).
  # Throwaway Postgres, then `next build` and Playwright's `next start`.
  # The spec seeds an admin and users, and uploads light/dark dialog
  # screenshots for Dana.
  e2e-admin-removal:
    name: Playwright admin removal
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timely
          POSTGRES_PASSWORD: timely
          POSTGRES_DB: timely
        options: >-
          --health-cmd "pg_isready -U timely -d timely"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432

    # Leave NODE_ENV unset. `production` at job level makes `npm ci`
    # omit devDependencies, and `npm run db:migrate` then fails with
    # `tsx: not found` (exit 127). Set production only on build and
    # the Playwright step that runs `next start`.
    env:
      DATABASE_URL: postgres://timely:timely@localhost:5432/timely
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-000000
      OAUTH_STATE_SECRET: ci-oauth-state-secret-ci-oauth-000000
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U timely && break
            sleep 1
          done

      - name: Create app runtime role
        run: node scripts/ensure-app-role.mjs

      - name: Apply migrations
        run: npm run db:migrate

      - name: Build (next build)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `npm run start` is `next start`. Playwright boots it after global
      # setup migrates the same database again (idempotent). tsx is
      # already on disk from the earlier `npm ci` (NODE_ENV unset).
      # Unset NODE_ENV would still use DATABASE_URL (client.ts only
      # switches to DATABASE_URL_TEST when NODE_ENV=test); production
      # is what `next start` and the secure session cookie expect.
      - name: Run Playwright admin-removal e2e (next start)
        env:
          NODE_ENV: production
        run: npx playwright test tests/e2e/admin-bulk-remove.spec.ts

      - name: Upload admin removal dialog screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: admin-removal-dialog
          path: test-results/admin-removal-dialog/
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-admin-removal-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-admin-removal-traces
          path: test-results
          if-no-files-found: ignore

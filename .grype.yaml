# Grype config for Clockinoff.
#
# Policy: fail CI only on Critical/High findings (enforced in
# .github/workflows/grype.yml via severity-cutoff: high). Medium/Low
# are reported for visibility but must NOT brick CD, so this file is
# the single place to baseline known Medium/Low noise. Keep ignores
# narrow (pin the vulnerability id + package) and leave a short
# rationale so a human can reassess later.

ignore:
  # FIXME(#57): Drizzle ORM SQL injection via improperly escaped
  # identifiers (CVE-2026-39356). Fix is drizzle-orm >= 0.45.2, but
  # that bump introduces breaking error-handling changes that fail
  # existing timer/entries tests (unique-violation errors no longer
  # surface through the service layer as TIMER_ALREADY_RUNNING without
  # service-side rework). Clockinoff only passes application-authored,
  # schema-driven identifiers to Drizzle; it never interpolates
  # user-controlled identifiers into Drizzle queries. Narrowly ignored
  # here so this scan workflow can land; a dedicated drizzle-orm
  # upgrade PR must retire this entry.
  - vulnerability: GHSA-gpj5-g38j-94v9
    package:
      name: drizzle-orm
      type: npm
